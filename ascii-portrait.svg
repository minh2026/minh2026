
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="20" y="45" width="800" height="780" rx="4"/>
    </clipPath>
  </defs>

  <rect width="840" height="880" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="839" height="879" rx="12" fill="none" stroke="#30363d"/>

  <line x1="0" y1="30" x2="840" y2="30" stroke="#30363d"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="15" r="5" fill="#27c93f"/>

  <text x="420" y="19" fill="#7d8590" font-size="12" text-anchor="middle">minh2026@github: ~$ ./portrait.sh</text>

  <g clip-path="url(#photoClip)">
    <image href="dminh.jpg"
           x="20" y="45"
           width="800" height="780"
           preserveAspectRatio="xMidYMid slice"/>
  </g>

  <line x1="0" y1="837" x2="840" y2="837" stroke="#30363d"/>

  <text x="20" y="856" fill="#7d8590" font-size="13">minh2026@github:~$ whoami <tspan fill="#c9d1d9">Pham Duc Minh</tspan></text>

  <rect x="402" y="844" width="8" height="14" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
