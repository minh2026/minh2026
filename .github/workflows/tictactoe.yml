name: Tic Tac Toe

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    entity: ${{ github.event.issue.title }}
    if: startsWith(github.event.issue.title, 'TicTacToe:')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Play Game
        uses: Saviru/tic-tac-toe-action@v1.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
