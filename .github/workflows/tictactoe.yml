name: Tic Tac Toe

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttictactoe|')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-level: '3.x'

      - name: Clone Game Package
        run: |
          git clone https://github.com game-repo
          cp -r game-repo/.github/workflows/scripts .
          rm -rf game-repo

      - name: Play Game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install PyGithub
          python scripts/play.py
