name: Tic Tac Toe

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'tictactoe|') # Chấp nhận lệnh chữ thường
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Play Game
        uses: jstrieb/github-action-tictactoe@v1.0.1
        with:
          MX_TOKEN: ${{ secrets.GITHUB_TOKEN }}
