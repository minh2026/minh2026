name: Tic Tac Toe

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttictactoe|') # Chỉ xử lý nếu đúng cú pháp game
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Play Game
        uses: Saviru/tic-tac-toe-action@v1.2 # Tên thư viện đúng (chữ S viết hoa)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
