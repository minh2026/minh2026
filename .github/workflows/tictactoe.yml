name: Tic Tac Toe

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttictactoe|') # Chỉ xử lý nếu issue là nước đi game
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Play Game
        uses: Saviru/tic-tac-toe-action@v1.2 # Script xử lý logic game tự động
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
