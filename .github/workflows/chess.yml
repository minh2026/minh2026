name: GitHub Activity Chess

on:
  issues:
    types: [opened]

jobs:
  update-chess:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'Chess:')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Chess Tools
        run: |
          pip install python-chess requests

      - name: Initialize Game
        run: |
          python -c "
          import chess
          import chess.svg
          board = chess.Board()
          with open('chess-board.png', 'w') as f:
              f.write(chess.svg.board(board))
          "
      - name: Commit and Push Board Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add chess-board.png
          git commit -m "Initialize chess board image" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
